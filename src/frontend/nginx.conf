# Serves the built admin SPA and forwards the API to the backend.
#
# The image (nginx-unprivileged) runs as the unprivileged `nginx` user and
# listens on 8080. Nothing here needs write access or a shell.

# Docker's embedded DNS, so a recreated backend container is picked up without
# reloading nginx (docker compose up -d backend changes its address).
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 8080;
    server_name _;

    set $backend "http://backend:8000";

    root /usr/share/nginx/html;
    index index.html;

    # The built bundle is static: no inline event handlers, no eval. The one
    # inline script is the theme bootstrap in index.html; its SHA-256 is
    # checked by src/frontend/tests/nginx-config.test.mjs, which recomputes it
    # from index.html, so editing that script without updating this header
    # fails the frontend test suite.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-uebFrZHMemd0Le6VzmC7gSXueO9nQWdUqtnwi00dvVU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The SPA calls /api/v1/... on its own origin; the backend serves the same
    # routes without the prefix.
    location /api/v1/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Append, never replace: the backend rate-limits logins on the
        # right-most entry of this header, so the value it sees per client is
        # the one nginx observed.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri /index.html;
    }
}

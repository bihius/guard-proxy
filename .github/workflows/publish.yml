name: Publish images

on:
  push:
    tags:
      - "v*"
  # Build-only dry run: both architectures are built on their native runners,
  # but nothing is pushed and no release is created (the `github.event_name`
  # conditions below). Useful to check a change to this workflow between tags.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  channel:
    name: release-channel
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.channel.outputs.stable }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
    steps:
      # One place decides the channel, so the GitHub release and the :latest
      # tag cannot disagree. Beta releases are public stable releases (owner
      # decision): v*-beta.* and vX.Y.Z go out as normal, Latest releases and
      # update :latest; only -alpha and -rc stay prereleases off :latest. A
      # manual run is on a branch ref, so both stay false and no mutable tag is
      # ever published from main.
      - name: Derive the release channel from the tag
        id: channel
        run: |
          stable=false
          prerelease=false
          case "${GITHUB_REF:-}" in
            refs/tags/v*)
              case "${GITHUB_REF_NAME}" in
                *-alpha | *-alpha.* | *-rc | *-rc.*) prerelease=true ;;
                *) stable=true ;;
              esac
              ;;
          esac
          printf 'stable=%s\n' "${stable}" >> "${GITHUB_OUTPUT}"
          printf 'prerelease=%s\n' "${prerelease}" >> "${GITHUB_OUTPUT}"

  publish:
    name: publish-${{ matrix.image.name }}-${{ matrix.platform.arch }}
    needs: channel
    runs-on: ${{ matrix.platform.runner }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/guard-proxy-${{ matrix.image.name }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            context: src/backend
            dockerfile: src/backend/Dockerfile
          - name: frontend
            context: src/frontend
            dockerfile: src/frontend/Dockerfile
          - name: coraza
            context: .
            dockerfile: docker/coraza.Dockerfile
          - name: log-shipper
            context: src/log-shipper
            dockerfile: src/log-shipper/Dockerfile
        # Each architecture is built on a runner of the same architecture:
        # emulating the Coraza (Go) and frontend (Node) builds would cost far
        # more than the extra runners, and `linux/arm64` images run natively on
        # Apple Silicon and ARM servers.
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=beta,enable=${{ contains(github.ref, '-beta.') }}
            type=raw,value=latest,enable=${{ needs.channel.outputs.stable == 'true' }}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build linux/${{ matrix.platform.arch }} and push it by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # One architecture per job, pushed under its digest; the `merge` job
          # tags the manifest list that combines them. A manual run keeps the
          # result in the build cache instead of pushing it.
          outputs: ${{ github.event_name == 'push' && format('type=image,name={0},name-canonical=true,push-by-digest=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Export the image digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          # The digest is the file name, so the merge job can list the files
          # of both architectures with a glob.
          : > "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the image digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge-${{ matrix.image.name }}
    needs: [publish, channel]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/guard-proxy-${{ matrix.image.name }}
    strategy:
      matrix:
        image:
          - name: backend
          - name: frontend
          - name: coraza
          - name: log-shipper
    steps:
      - name: Download the image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.image.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=beta,enable=${{ contains(github.ref, '-beta.') }}
            type=raw,value=latest,enable=${{ needs.channel.outputs.stable == 'true' }}
            type=sha,format=short

      - name: Create the multi-arch manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # both substitutions expand to argument lists
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)

  release-kit:
    name: release-kit
    needs: [publish, merge, channel]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Derive release tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build release-kit archive
        run: |
          mkdir -p dist
          tar -czf "dist/guard-proxy-release-${{ steps.tag.outputs.tag }}.tar.gz" \
            -C release .

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # Same rule as the :latest tag: a beta is a stable release.
          prerelease: ${{ needs.channel.outputs.prerelease }}
          make_latest: ${{ needs.channel.outputs.stable }}
          files: dist/guard-proxy-release-${{ steps.tag.outputs.tag }}.tar.gz
          generate_release_notes: true

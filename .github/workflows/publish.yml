name: Publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish-${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: backend
            context: src/backend
            dockerfile: src/backend/Dockerfile
          - name: frontend
            context: src/frontend
            dockerfile: src/frontend/Dockerfile
          - name: coraza
            context: .
            dockerfile: docker/coraza.Dockerfile
          - name: log-shipper
            context: src/log-shipper
            dockerfile: src/log-shipper/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/guard-proxy-${{ matrix.image.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=beta,enable=${{ contains(github.ref, '-beta.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  release-kit:
    name: release-kit
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Derive release tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build release-kit archive
        run: |
          mkdir -p dist
          tar -czf "dist/guard-proxy-release-${{ steps.tag.outputs.tag }}.tar.gz" \
            -C release .

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          # A tag with a pre-release suffix (e.g. -beta.2) is a prerelease;
          # a bare version tag (e.g. v1.0.0) is a stable release.
          prerelease: ${{ contains(github.ref, '-') }}
          files: dist/guard-proxy-release-${{ steps.tag.outputs.tag }}.tar.gz
          generate_release_notes: true

name: E2E Smoke

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Read-only: the smoke test builds the stack and runs it locally.
permissions:
  contents: read

jobs:
  smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.6"
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock

      - name: Install backend dependencies
        working-directory: src/backend
        run: uv sync --frozen --extra dev

      - name: Prepare Docker Compose environment
        run: make env

      - name: Run policy apply e2e test
        working-directory: src/backend
        run: uv run pytest -m e2e tests/e2e/test_policy_apply.py

      - name: Run E2E smoke test
        run: bash benchmarks/smoke/e2e.sh

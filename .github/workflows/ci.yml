name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Read-only: CI only checks out the repository and runs tests.
permissions:
  contents: read

jobs:
  version-pins:
    name: version-pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check third-party component pins
        run: python3 .github/scripts/check_version_pins.py

  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.6"

      - name: Run evaluation lab unit tests
        run: uv run --no-project --with pytest==9.0.2 pytest benchmarks/tests

  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.6"

      - name: Cache uv packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('src/backend/pyproject.toml', 'src/backend/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install backend dependencies
        run: uv sync --frozen --extra dev

      - name: Verify Alembic migrations and model drift
        env:
          JWT_SECRET_KEY: ci-jwt-secret-key-not-used-at-runtime
          LOG_INGEST_SHARED_SECRET: ci-log-ingest-secret-not-used-at-runtime
          DATABASE_URL: sqlite:///./ci_alembic_check.db
        run: |
          uv run alembic upgrade heads
          uv run alembic check

      - name: Run backend tests with coverage
        run: uv run pytest --cov=app

      - name: Run mypy
        run: uv run mypy app/

      - name: Run ruff
        run: uv run ruff check app/

      - name: Detect Polish diacritics in backend Python files
        working-directory: src/backend
        run: |
          status=0
          grep -RIn --include='*.py' "[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]" app || status=$?
          if [ "$status" -eq 0 ]; then
            echo "Found Polish diacritics in backend Python files under src/backend/app."
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "grep failed while scanning backend Python files under src/backend/app."
            exit "$status"
          fi

  log-shipper:
    name: log-shipper
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/log-shipper
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.6"

      - name: Cache uv packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-log-shipper-${{ hashFiles('src/log-shipper/pyproject.toml', 'src/log-shipper/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-log-shipper-

      - name: Install log-shipper dependencies
        run: uv sync --frozen --extra dev

      - name: Run log-shipper tests with coverage
        run: uv run pytest --cov=app

      - name: Run mypy
        run: uv run mypy app/

      - name: Run ruff
        run: uv run ruff check app/

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.30.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend type-check
        run: pnpm run type-check

      - name: Run frontend lint
        run: pnpm run lint

      - name: Run frontend tests
        run: pnpm run test

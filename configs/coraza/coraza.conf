# Baseline Coraza directives shared by every Coraza application.
#
# Each application (one per WAF policy) includes this file first, then its
# own CRS setup, the CRS rules, Guard Proxy's exceptions, and its own tuning.
# The backend generates the application list into
# /runtime/current/coraza-spoa.yaml and the per-application files into
# /runtime/current/coraza/<application>/ on every config apply.

SecRequestBodyAccess On
SecResponseBodyAccess Off

# Parse XML and JSON request bodies with the matching body processor, so CRS
# inspects their fields as ARGS. Without these rules a JSON body went through
# the URL-encoded parser and became one long argument name, which scored SQLi
# false positives (942200, 942340, 942430) on any JSON request at PL2.
# Rules 200000-200002 and 200006 are taken from Coraza's
# coraza.conf-recommended.
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
    "id:'200000',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:'200001',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^application/[a-z0-9.-]+[+]json" \
    "id:'200006',phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# A body that fails to parse is not inspected field by field, so reject it
# instead of letting it through unchecked.
SecRule REQBODY_ERROR "!@eq 0" \
    "id:'200002',phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',logdata:'%{reqbody_error_msg}',severity:2"

SecAuditEngine RelevantOnly
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /var/log/coraza/audit.log
SecAuditLogParts ABIJDEFHZ

SecDefaultAction "phase:1,log,auditlog,pass"
SecDefaultAction "phase:2,log,auditlog,pass"

# Fallback coraza-spoa configuration baked into the Coraza image.
#
# The supervisor uses it only while the active runtime release has no
# generated coraza-spoa.yaml: the entrypoint stub on a fresh volume, or a
# release written before per-policy Coraza applications existed (those send
# every vhost to `default`). Like the generated config, it declares no
# default_application, so an application name Coraza does not know fails the
# SPOE call (HAProxy answers 503) instead of being inspected with another
# policy.

bind: 0.0.0.0:9000
log_level: info
log_file: /dev/stderr
log_format: console

applications:
  - name: default
    directives: |
      Include /etc/coraza/coraza.conf
      Include /runtime/current/crs-setup.conf
      Include /etc/coraza/crs/rules/*.conf
      Include /etc/coraza/guard-proxy-exceptions.conf
      Include /runtime/current/rule-overrides.conf
    response_check: false
    transaction_ttl_ms: 60000
    log_level: info
    log_file: /dev/stderr
    log_format: console

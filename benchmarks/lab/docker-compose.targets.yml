# Evaluation lab target applications.
#
# This is an OVERLAY on top of the real Guard Proxy stack. Run as:
#   docker compose \
#     -f docker/docker-compose.yml \
#     -f benchmarks/lab/docker-compose.targets.yml \
#     --env-file docker/.env \
#     --env-file benchmarks/lab/.env \
#     up -d --build
#
# Targets remain on gp_internal; both expose baseline-only ports bound to
# localhost by default (override the bind address for remote tests).
#
# Pinned image digests ensure reproducible test results across runs.
# Update pins by running: docker pull <image> && docker inspect --format '{{index .RepoDigests 0}}' <image>

name: guard-proxy

services:
  backend:
    cpuset: "${LAB_WAF_CPUSET:-}"
    ports:
      - "${BACKEND_HTTP_PORT:-8000}:8000"

  postgres:
    cpuset: "${LAB_WAF_CPUSET:-}"

  frontend:
    cpuset: "${LAB_WAF_CPUSET:-}"

  coraza:
    cpuset: "${LAB_WAF_CPUSET:-}"
    # Lab only: wrap the Guard Proxy exceptions file so every policy also
    # loads the go-ftw log-marker rule (see benchmarks/lab/coraza/). The
    # production file is mounted under a new name and included from the
    # wrapper. Relative paths resolve from docker/ (the first compose file).
    volumes:
      - ../configs/coraza/guard-proxy-exceptions.conf:/etc/coraza/guard-proxy-exceptions.base.conf:ro
      - ../benchmarks/lab/coraza/guard-proxy-exceptions.lab.conf:/etc/coraza/guard-proxy-exceptions.conf:ro
    # Lab only: also copy Coraza's log (matched rules, written to stderr) into
    # /var/log/coraza/error.log on the coraza_audit volume. go-ftw mounts that
    # volume and reads the rule IDs of each CRS test from this file. tini -g
    # forwards stop signals to the whole pipeline.
    entrypoint:
      - /sbin/tini
      - -g
      - --
      - sh
      - -c
      - /usr/local/bin/coraza-supervisor 2>&1 | tee -a /var/log/coraza/error.log

  haproxy:
    cpuset: "${LAB_WAF_CPUSET:-}"

  log-shipper:
    cpuset: "${LAB_WAF_CPUSET:-}"

  # ── CRS FTW backend ───────────────────────────────────────────────────────
  # Albedo is the backend used by the CRS project for go-ftw regression tests.
  # It answers every request with 200, so it is also the load-test target:
  # the WAF-vs-direct delta then measures HAProxy+Coraza, not the application.
  # Vhost: ftw.local
  ftw-backend:
    image: ghcr.io/coreruleset/albedo:0.2.0@sha256:bc9b7e4f83a5268ccd2b4d1d26e926b6324e20ff1d91281c339ad82e55f5bab2
    cpuset: "${LAB_WAF_CPUSET:-}"
    restart: unless-stopped
    # Expose the baseline only to the selected benchmark interface.
    ports:
      - "${LAB_SERVER_ADDR:-127.0.0.1}:${LAB_FTW_DIRECT_PORT:-18080}:8080"
    networks:
      - gp_internal

  # ── WordPress ─────────────────────────────────────────────────────────────
  # Real-world CMS. Target of the tagged benign/attack corpus (no CRS
  # exclusion plugins applied — intentional).
  # Vhost: wp.local
  wp-db:
    image: mariadb:11.4.13@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    cpuset: "${LAB_WAF_CPUSET:-}"
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:-wp_root_pw}
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WP_DB_PASSWORD:-wp_pw}
    volumes:
      - wp_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - gp_internal

  wordpress:
    # WordPress 7.1.3 core; the runner records `wp core version` in manifest.json.
    image: wordpress:7.1.3-php8.3-apache@sha256:8ecd8d8e374167ea22235acf30f80d1165b82f07ffa5bcef90c1cad8f7be251f
    cpuset: "${LAB_WAF_CPUSET:-}"
    restart: unless-stopped
    ports:
      - "${LAB_SERVER_ADDR:-127.0.0.1}:${LAB_WP_DIRECT_PORT:-18081}:80"
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wp_pw}
      WORDPRESS_TABLE_PREFIX: wp_
    depends_on:
      wp-db:
        condition: service_healthy
    volumes:
      - wp_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/wp-login.php >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - gp_internal

  # One-shot WP CLI container that installs WordPress deterministically.
  # Not started by `up` (profile "setup"); setup-lab.sh runs it with
  # `compose run`, so the corpus always hits an installed site, not the
  # installer redirect.
  # Tagged by WP-CLI version, not WordPress version: the CLI only drives the
  # site files in the wp_data volume, so its version does not pin the core.
  wp-cli:
    image: wordpress:cli-2.12.0-php8.3@sha256:36243da432a0f0a3b56dc3240ecee9b159108d71305e7c064d987a20a465bfde
    cpuset: "${LAB_WAF_CPUSET:-}"
    profiles: ["setup"]
    restart: "no"
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wp_pw}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-LabAdmin12345!}
    volumes:
      - wp_data:/var/www/html
    depends_on:
      wordpress:
        condition: service_healthy
    # One line on purpose: a folded YAML scalar keeps the newlines of
    # more-indented lines, which split `wp core install` from its flags.
    entrypoint: ["sh", "-c"]
    command:
      - wp core is-installed || wp core install --url=http://wp.local --title='Guard Proxy Lab' --admin_user=admin --admin_password="$$WP_ADMIN_PASSWORD" --admin_email=admin@lab.local --skip-email
    networks:
      - gp_internal

networks:
  gp_internal:

volumes:
  wp_db_data:
  wp_data:

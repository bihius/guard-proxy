# Lab-only wrapper around configs/coraza/guard-proxy-exceptions.conf.
#
# docker-compose.targets.yml mounts this file in place of the production
# exceptions file, so every generated WAF policy loads it after the CRS rules.
# It keeps the production exceptions and adds one rule: the go-ftw log marker.
#
# go-ftw (run-ftw.sh) brackets every CRS regression test with two marker
# requests that carry the X-GP-FTW-Marker header. This rule writes the header
# value into the Coraza error log, so go-ftw can cut out exactly the log lines
# of one test and check which rule IDs fired. The marker request itself is
# excluded from all other rules so it never adds noise to a test.
#
# NEVER load this file outside the lab: any client that sends the marker
# header would switch off rule evaluation for its own request.

Include /etc/coraza/guard-proxy-exceptions.base.conf

SecRule REQUEST_HEADERS:X-GP-FTW-Marker "@rx ^.*$" \
    "id:999999,\
    phase:1,\
    pass,\
    log,\
    msg:'X-GP-FTW-Marker %{MATCHED_VAR}',\
    ctl:ruleRemoveById=1-999998"

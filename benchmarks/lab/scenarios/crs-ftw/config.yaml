# go-ftw configuration for Test 2 (CRS regression suite) against guard-proxy.
#
# run-ftw.sh renders this file before use: it substitutes the {{ env "..." }}
# values and appends a `testoverride.ignore` map for tests that cannot pass in
# this setup by design (rules above the policy's paranoia level, response
# rules). Run it through `make eval-ftw`, not by hand.
#
# Log mode, not cloud mode. In cloud mode go-ftw only compares HTTP status
# codes, and a test that asserts no status (most CRS tests only list the rule
# IDs that must or must not fire) passes without any check. Log mode reads one
# log file and checks the rule IDs of every test.

# Coraza's serial JSON audit log is written before the request returns.
# The previous lab overlay copied stderr through tee. go-ftw could read that
# copy before tee wrote the marker or while its line was incomplete, causing
# marker lookup failures or missing rule IDs. The audit log stores both
# markers and the CRS error messages (including JSON-escaped rule IDs).
logfile: /var/log/coraza/audit.log

# Marker header matched by rule 999999 in
# benchmarks/lab/coraza/guard-proxy-exceptions.lab.conf. go-ftw sends one
# marker request before and one after each test and reads only the log lines
# between the two markers.
logmarkerheadername: X-GP-FTW-Marker
maxmarkerretries: 20
maxmarkerloglines: 2000

# Route every CRS test through HAProxy to the ftw.local vhost (Albedo, the
# backend the CRS project itself uses for these tests). virtual_host_mode
# sends the marker requests to the same vhost, so they reach the same policy.
testoverride:
  input:
    dest_addr: haproxy
    port: 80
    protocol: http
    virtual_host_mode: true
    headers:
      Host: '{{ env "TARGET_VHOST" }}'
      X-GP-Eval-Run: '{{ env "RUN_ID" }}'
      X-GP-Eval-Scenario: ftw
